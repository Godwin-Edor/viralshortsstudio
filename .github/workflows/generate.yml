name: Generate videos

on:
  schedule:
    - cron: "17 13 * * *"     # every day at 13:17 UTC (7:17 am Central). Change as you like.
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos"
        required: false
        default: "1"
      topic:
        description: "Optional topic (leave empty to auto-pick)"
        required: false
        default: ""

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-montserrat fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Make videos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          COUNT: ${{ github.event.inputs.count }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          ARGS=()
          if [ -n "$COUNT" ]; then ARGS+=(--count "$COUNT"); fi
          if [ -n "$TOPIC" ]; then ARGS+=(--topic "$TOPIC"); fi
          python -m vvapp.generate "${ARGS[@]}"
