# ------------------------------------------------------------
# Viral Shorts Studio - main settings (edit freely)
# ------------------------------------------------------------

# Overall channel theme (each category below has its own niche).
niche: "Mind-blowing, true facts that make people say \"I never knew that!\""
audience: "curious teenagers and adults who scroll short videos (content must be suitable for under-18s)"
language: "English"

# ---------- Categories (one video from each, every US morning) ----------
# Each category is a recurring series. The daily run makes one video per category and
# schedules it on YouTube for its morning slot (US Eastern time). Order = posting order.
# Remove a block to stop that category; copy one to add a new category.
categories:
  - key: mindblown
    series: "You've Been Lied To"
    niche: "Popular myths and 'facts' almost everyone believes that are actually wrong (bulls hate red, goldfish 3-second memory, glass is a liquid), busted with the surprising truth."
    format: "Hook = the myth stated as if true, then 'Wrong.' Reveal the real truth step by step with one jaw-dropping detail, end by asking which myth they believed."
    hashtag: "mythbusting"
    youtube_category: "27"
    footage: ["surprised person", "question mark", "city crowd"]
    publish_et: "07:00"
  - key: quiz
    series: "Can You Guess It?"
    niche: "Guessing game: an amazing mystery animal, place, object, food or invention described with clever clues."
    format: "Hook = 'Only 1 in 10 people can guess this in 3 clues.' Give 3 clues from hardest to easiest, each with a short pause line ('Got it yet?'). Then 'Comment your guess... 3, 2, 1' and the reveal with one more wow fact. The answer must NOT appear in the title, hook text or caption."
    hashtag: "quiz"
    youtube_category: "24"          # Entertainment
    footage: ["question mark", "magnifying glass", "puzzle"]
    publish_et: "07:30"
  - key: history
    series: "History's Strangest True Stories"
    niche: "Surprising, true, family-friendly stories from history: bizarre events, odd inventions, strange laws, incredible coincidences, lucky accidents and clever tricks. NO wars, armies, soldiers, weapons, battles, deaths, disasters, crime or cruelty."
    format: "Tell it like a gripping story: drop the viewer into the moment, build suspense, then a twist ending that makes them say 'no way'."
    hashtag: "history"
    youtube_category: "27"
    footage: ["ancient ruins", "old map", "museum"]
    publish_et: "08:00"
  - key: wyr
    series: "Would You Rather?"
    niche: "Fun, imaginative 'would you rather' dilemmas (live on Mars or under the ocean, be able to fly or breathe underwater) answered with real science."
    format: "Hook = the dilemma. Make both sides sound amazing, then reveal the surprising science of what each would really be like, and ask viewers to vote A or B in the comments."
    hashtag: "wouldyourather"
    youtube_category: "24"
    footage: ["fork in the road", "ocean", "planet"]
    publish_et: "08:30"
  - key: mystery
    series: "Mysteries Nobody Can Explain"
    niche: "Real, family-friendly unexplained (or recently solved) mysteries: strange signals from space, undeciphered books, ancient machines, moving rocks, lost cities. Clearly separate what is known from what is unknown; no ghosts, horror or anything scary."
    format: "Open with the most baffling fact, layer clue after clue like a detective story, give the best theories, end on the open question and ask viewers what they think."
    hashtag: "mystery"
    youtube_category: "27"
    footage: ["ancient ruins", "night sky", "old book"]
    publish_et: "09:00"
  - key: whatif
    series: "What If...?"
    niche: "Epic science-based 'what if' scenarios answered with real physics, biology and astronomy (what if you could dig through the Earth, what if Earth had rings, what if humans could photosynthesize). Imaginative but accurate, full of wonder, never scary or doom-laden."
    format: "Hook = the scenario. Walk through it second by second / step by step with escalating, vivid consequences, and end with the most surprising outcome."
    hashtag: "whatif"
    youtube_category: "28"
    footage: ["earth from space", "planet", "city skyline"]
    publish_et: "09:30"

# Optional: put your own topic ideas in topics.txt (one per line).
# The generator uses those first, then lets the AI pick new topics.
topics_file: "topics.txt"

# Video length and pace
target_seconds: 40          # 30-50 s works well for Shorts/Reels/TikTok
seconds_per_shot: 2.6
ai_people_per_video: 3      # photorealistic AI-made (fictional) people in up to 3 scenes; 0 = off       # cut to a new clip about every 2.5 s (keeps viewers watching)
videos_per_run: 1           # videos per category per run

# Free AI script writer (Google Gemini free tier)
gemini_model: ["gemini-flash-latest", "gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-flash-lite-latest"]   # tried in order

# Free voice (Microsoft Edge neural voices, no key needed)
voice: "en-US-AndrewMultilingualNeural"   # other good ones: en-US-AvaMultilingualNeural, en-GB-RyanNeural
voice_rate: "+14%"                          # a bit faster than normal sounds more energetic

# Captions burned into the video
captions:
  font: "Montserrat"         # falls back to DejaVu Sans if not installed
  size: 110
  words_per_line: 3
  highlight_color: "00E5FF"  # colour of the word being spoken (hex RRGGBB)
  position_from_bottom: 620  # pixels from bottom of a 1920-px-tall video

# Optional background music: drop royalty-free .mp3 files into the music/ folder
music_dir: "music"
music_volume: 0.13
# Royalty-free Pixabay tracks (Pixabay licence: free to use, no attribution needed).
# Used when the music/ folder is empty; one is picked at random for each video.
music_urls:
  - "https://cdn.pixabay.com/audio/2026/11/10/audio_cb4bc9cb61.mp3"
  - "https://cdn.pixabay.com/audio/2026/08/03/audio_e214f508d8.mp3"
  - "https://cdn.pixabay.com/audio/2026/07/28/audio_dca3f157b3.mp3"
  - "https://cdn.pixabay.com/audio/2026/06/21/audio_39692ced6f.mp3"
  - "https://cdn.pixabay.com/audio/2025/08/03/audio_a91fee42fa.mp3"
  - "https://cdn.pixabay.com/audio/2026/10/30/audio_c7a4969b4f.mp3"

# ---------- Posting ----------
# auto_post: true  = the AI reviewer checks each video and it is posted with no human approval.
# auto_post: false = videos wait on the dashboard under "To review".
auto_post: true
# Platforms auto-posting goes to. Add each one here once it is connected.
auto_platforms: ["youtube", "tiktok"]
# Platforms ticked by default on the approval dashboard (used when auto_post is false)
platforms_default: ["youtube", "tiktok", "instagram", "facebook"]

# ---------- AI reviewer ----------
min_hook_score: 8          # 1-10; scripts with a weaker hook are rewritten
min_fun_score: 7           # 1-10; 'would a bored scroller stop and watch?' - weaker scripts are rewritten
review_rewrites: 2         # how many rewrites before a topic is skipped (rejected, nothing posted)
check_footage: true        # AI looks at every clip: must match the narration and be family-friendly

youtube:
  privacy: "public"          # stays private until Google audits your API project (see README)
  category_id: "28"          # 28 = Science & Technology
  made_for_kids: false      # family-friendly but for a general audience; "true" turns off comments and notifications
  synthetic_media: false     # set true if a video shows realistic AI-made people/events

tiktok:
  mode: "inbox"              # "inbox" = sends a draft to your TikTok app to finish and post
                             # "direct" = posts directly (only public after TikTok audits your app)
  direct_privacy: "SELF_ONLY"

meta_graph_version: "v24.0"   # Instagram + Facebook API version

x:
  enabled: false             # X has no free API tier (pay per post); turn on when you add credits

# Delete the video file from Supabase storage after it is posted everywhere (saves free space)
cleanup_after_post: true
