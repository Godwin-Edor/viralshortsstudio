# ------------------------------------------------------------
# Viral Shorts Studio - main settings (edit freely)
# ------------------------------------------------------------

# Overall channel theme (each category below has its own niche).
niche: "Mind-blowing, true facts that make people say \"I never knew that!\""
audience: "curious teenagers and adults who scroll short videos (content must be suitable for under-18s)"
language: "English"

# ---------- Categories (one video from each, every US morning) ----------
# Each category is a recurring series. The daily run makes one video per category and
# schedules it on YouTube for its morning slot (US Eastern time). Order = posting order.
# Remove a block to stop that category; copy one to add a new category.
categories:
  - key: history
    series: "History's Strangest True Stories"
    niche: "Surprising, true, family-friendly stories from history: odd inventions, strange laws, famous mix-ups, ancient technology, lucky accidents and forgotten firsts. NO wars, battles, deaths, disasters, crime or cruelty."
    hashtag: "history"
    youtube_category: "27"          # Education
    footage: ["ancient ruins", "old map", "museum"]
    publish_et: "07:00"
  - key: brain
    series: "Your Brain Is Weird"
    niche: "Fascinating, true facts about how the human brain, senses and everyday psychology work: optical illusions, memory quirks, habits, why we yawn, deja vu. Explained simply, with NO medical or mental-health advice."
    hashtag: "psychology"
    youtube_category: "27"
    footage: ["brain", "eye closeup", "people walking"]
    publish_et: "07:30"
  - key: whatif
    series: "What If...?"
    niche: "Science-based 'what if' scenarios answered with real physics, biology and astronomy (what if you could dig through the Earth, what if Earth had rings). Imaginative but accurate, full of wonder, never scary or doom-laden."
    hashtag: "whatif"
    youtube_category: "28"          # Science & Technology
    footage: ["earth from space", "planet", "city skyline"]
    publish_et: "08:00"
  - key: space
    series: "Space Is Unbelievable"
    niche: "Mind-blowing, true facts about space, planets, stars, black holes and astronauts' daily life."
    hashtag: "space"
    youtube_category: "28"
    footage: ["galaxy", "planet", "astronaut"]
    publish_et: "08:30"
  - key: science
    series: "Science They Never Taught You"
    niche: "Mind-blowing science and chemistry facts that most people never learned in school"
    hashtag: "science"
    youtube_category: "28"
    footage: ["science laboratory", "microscope", "chemistry"]
    publish_et: "09:00"
    use_topics_file: true           # topics.txt ideas are used for this category first
  - key: nature
    series: "Nature's Wildest Facts"
    niche: "Astonishing, true facts about animals, plants and the natural world: amazing abilities, strange behaviours, record-breakers. NO hunting, animals hurting each other, or anything gory."
    hashtag: "animals"
    youtube_category: "15"          # Pets & Animals
    footage: ["wildlife", "forest", "ocean"]
    publish_et: "09:30"

# Optional: put your own topic ideas in topics.txt (one per line).
# The generator uses those first, then lets the AI pick new topics.
topics_file: "topics.txt"

# Video length and pace
target_seconds: 40          # 30-50 s works well for Shorts/Reels/TikTok
seconds_per_shot: 2.6       # cut to a new clip about every 2.5 s (keeps viewers watching)
videos_per_run: 1           # videos per category per run

# Free AI script writer (Google Gemini free tier)
gemini_model: ["gemini-flash-latest", "gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-flash-lite-latest"]   # tried in order

# Free voice (Microsoft Edge neural voices, no key needed)
voice: "en-US-AndrewMultilingualNeural"   # other good ones: en-US-AvaMultilingualNeural, en-GB-RyanNeural
voice_rate: "+10%"                          # a bit faster than normal sounds more energetic

# Captions burned into the video
captions:
  font: "Montserrat"         # falls back to DejaVu Sans if not installed
  size: 110
  words_per_line: 3
  highlight_color: "00E5FF"  # colour of the word being spoken (hex RRGGBB)
  position_from_bottom: 620  # pixels from bottom of a 1920-px-tall video

# Optional background music: drop royalty-free .mp3 files into the music/ folder
music_dir: "music"
music_volume: 0.10

# ---------- Posting ----------
# auto_post: true  = the AI reviewer checks each video and it is posted with no human approval.
# auto_post: false = videos wait on the dashboard under "To review".
auto_post: true
# Platforms auto-posting goes to. Add each one here once it is connected.
auto_platforms: ["youtube", "tiktok"]
# Platforms ticked by default on the approval dashboard (used when auto_post is false)
platforms_default: ["youtube", "tiktok", "instagram", "facebook"]

# ---------- AI reviewer ----------
min_hook_score: 7          # 1-10; scripts with a weaker hook are rewritten
review_rewrites: 2         # how many rewrites before a topic is skipped (rejected, nothing posted)
check_footage: true        # AI looks at every clip: must match the narration and be family-friendly

youtube:
  privacy: "public"          # stays private until Google audits your API project (see README)
  category_id: "28"          # 28 = Science & Technology
  made_for_kids: false      # family-friendly but for a general audience; "true" turns off comments and notifications
  synthetic_media: false     # set true if a video shows realistic AI-made people/events

tiktok:
  mode: "inbox"              # "inbox" = sends a draft to your TikTok app to finish and post
                             # "direct" = posts directly (only public after TikTok audits your app)
  direct_privacy: "SELF_ONLY"

meta_graph_version: "v24.0"   # Instagram + Facebook API version

x:
  enabled: false             # X has no free API tier (pay per post); turn on when you add credits

# Delete the video file from Supabase storage after it is posted everywhere (saves free space)
cleanup_after_post: true
