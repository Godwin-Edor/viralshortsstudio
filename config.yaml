# ------------------------------------------------------------
# Viral Shorts Studio - main settings (edit freely)
# ------------------------------------------------------------

# What the channel is about. Keep it narrow: one niche grows faster.
niche: "Mind-blowing science and chemistry facts that most people never learned in school"
audience: "curious teenagers and adults who scroll short videos"
language: "English"

# Optional: put your own topic ideas in topics.txt (one per line).
# The generator uses those first, then lets the AI pick new topics.
topics_file: "topics.txt"

# Video length and pace
target_seconds: 40          # 30-50 s works well for Shorts/Reels/TikTok
seconds_per_shot: 3.2       # cut to a new clip about every 3 s (keeps viewers watching)
videos_per_run: 1           # how many videos each scheduled run makes

# Free AI script writer (Google Gemini free tier)
gemini_model: ["gemini-flash-latest", "gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-flash-lite-latest"]   # tried in order

# Free voice (Microsoft Edge neural voices, no key needed)
voice: "en-US-AndrewMultilingualNeural"   # other good ones: en-US-AvaMultilingualNeural, en-GB-RyanNeural
voice_rate: "+8%"                          # a bit faster than normal sounds more energetic

# Captions burned into the video
captions:
  font: "Montserrat"         # falls back to DejaVu Sans if not installed
  size: 110
  words_per_line: 3
  highlight_color: "00E5FF"  # colour of the word being spoken (hex RRGGBB)
  position_from_bottom: 620  # pixels from bottom of a 1920-px-tall video

# Optional background music: drop royalty-free .mp3 files into the music/ folder
music_dir: "music"
music_volume: 0.10

# Platforms ticked by default on the approval dashboard
platforms_default: ["youtube", "tiktok", "instagram", "facebook"]

youtube:
  privacy: "public"          # stays private until Google audits your API project (see README)
  category_id: "28"          # 28 = Science & Technology
  made_for_kids: false
  synthetic_media: false     # set true if a video shows realistic AI-made people/events

tiktok:
  mode: "inbox"              # "inbox" = sends a draft to your TikTok app to finish and post
                             # "direct" = posts directly (only public after TikTok audits your app)
  direct_privacy: "SELF_ONLY"

meta_graph_version: "v24.0"   # Instagram + Facebook API version

x:
  enabled: false             # X has no free API tier (pay per post); turn on when you add credits

# Delete the video file from Supabase storage after it is posted everywhere (saves free space)
cleanup_after_post: true
